<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dlužníček - Cloudový zápisník</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Společný kontejner */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        /* Skrývání sekcí */
        .hidden {
            display: none !important;
        }

        /* Autentizační obrazovka */
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .toggle-text span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
        }

        /* Hlavní aplikace */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .user-info {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .debt-list {
            list-style: none;
            margin-top: 20px;
        }

        .debt-item {
            background: var(--bg);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .debt-info .name {
            font-weight: 600;
        }

        .debt-info .amount {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .delete-debt {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.2s;
        }

        .delete-debt:hover {
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div id="auth-container" class="container">
        <div class="auth-header">
            <i class="fa-solid fa-vault"></i>
            <h1 id="auth-title">Přihlášení do Dlužníčku</h1>
        </div>

        <form id="auth-form">
            <div class="form-group">
                <label for="email">E-mailová adresa</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="jmeno@seznam.cz" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Heslo (min. 6 znaků)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn">
                <i class="fa-solid fa-right-to-bracket"></i> <span id="btn-text">Přihlásit se</span>
            </button>
        </form>

        <p class="toggle-text" id="toggle-auth">
            Nemáš účet? <span id="toggle-link">Vytvořit účet</span>
        </p>
        <div id="error-message" class="error-msg"></div>
    </div>

    <div id="app-container" class="container hidden">
        <div class="app-header">
            <div>
                <h2>Můj Dlužníček</h2>
                <div class="user-info" id="user-display"></div>
            </div>
            <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-power-off"></i> Odhlásit</button>
        </div>

        <form id="debt-form">
            <div class="form-group">
                <label for="debtor-name">Kdo mi dluží / Komu dlužím</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="debtor-name" placeholder="Např. Petr Novák" required>
                </div>
            </div>
            <div class="form-group">
                <label for="debt-amount">Částka (Kč)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <input type="number" id="debt-amount" placeholder="Např. 500" required>
                </div>
            </div>
            <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Přidat záznam</button>
        </form>

        <ul id="debt-list" class="debt-list">
            </ul>
    </div>

    <script type="module">
        // Importy Firebase modulů z oficiálního CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        // Tvá konfigurace Firebase (Propojeno s tvým projektem duluznicek)
        const firebaseConfig = {
            apiKey: "AIzaSyDLwW-2_e7Y963H8ZpXU_K-H7XInS6v5uE",
            authDomain: "duluznicek.firebaseapp.com",
            databaseURL: "https://duluznicek-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "duluznicek",
            storageBucket: "duluznicek.appspot.com",
            messagingSenderId: "59160533519",
            appId: "1:59160533519:web:5ee105d1b7d532b26090e5"
        };

        // Inicializace Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // DOM Elementy
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authTitle = document.getElementById('auth-title');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const toggleLink = document.getElementById('toggle-link');
        const toggleAuth = document.getElementById('toggle-auth');
        const errorMessage = document.getElementById('error-message');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');
        
        const debtForm = document.getElementById('debt-form');
        const debtorNameInput = document.getElementById('debtor-name');
        const debtAmountInput = document.getElementById('debt-amount');
        const debtListElement = document.getElementById('debt-list');

        let isLoginMode = true;
        let currentUser = null;

        // Přepínání mezi Přihlášením a Registrací
        toggleLink.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            errorMessage.textContent = "";
            if (isLoginMode) {
                authTitle.textContent = "Přihlášení do Dlužníčku";
                btnText.textContent = "Přihlásit se";
                toggleAuth.innerHTML = 'Nemáš účet? <span id="toggle-link">Vytvořit účet</span>';
            } else {
                authTitle.textContent = "Nová registrace";
                btnText.textContent = "Vytvořit účet a přihlásit se";
                toggleAuth.innerHTML = 'Už máš účet? <span id="toggle-link">Přihlásit se</span>';
            }
            // Znovu navázat event listener na dynamicky přepsaný odkaz
            document.getElementById('toggle-link').addEventListener('click', arguments.callee);
        });

        // Zpracování Přihlášení / Registrace
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            errorMessage.textContent = "";

            if (isLoginMode) {
                // Přihlášení
                signInWithEmailAndPassword(auth, email, password)
                    .catch(error => {
                        errorMessage.textContent = "Chyba: Nesprávné heslo nebo uživatel neexistuje.";
                        console.error(error);
                    });
            } else {
                // Registrace nového uživatele
                createUserWithEmailAndPassword(auth, email, password)
                    .then(() => {
                        // Po úspěšné registraci vyčistíme formulář
                        authForm.reset();
                    })
                    .catch(error => {
                        if (error.code === 'auth/email-already-in-use') {
                            errorMessage.textContent = "Tento e-mail už je zaregistrovaný.";
                        } else if (error.code === 'auth/weak-password') {
                            errorMessage.textContent = "Heslo musí mít aspoň 6 znaků.";
                        } else {
                            errorMessage.textContent = "Registrace se nezdařila. Zkontroluj povolené domény ve Firebase.";
                        }
                        console.error(error);
                    });
            }
        });

        // Odhlášení
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Sledování stavu přihlášení (Srdce celé aplikace)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Uživatel je přihlášen
                currentUser = user;
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userDisplay.textContent = `Přihlášen jako: ${user.email}`;
                authForm.reset();
                errorMessage.textContent = "";
                
                // Načti data pro daného uživatele
                nactiDluhy(user.uid);
            } else {
                // Uživatel je odhlášen
                currentUser = null;
                appContainer.classList.add('hidden');
                authContainer.classList.remove('hidden');
                debtListElement.innerHTML = "";
            }
        });

        // PŘIDÁNÍ DLUHU DO CLOUDOVÉ DATABÁZE
        debtForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const name = debtorNameInput.value.trim();
            const amount = debtAmountInput.value.trim();

            const userDebtsRef = ref(db, `debts/${currentUser.uid}`);
            const newDebtRef = push(userDebtsRef);
            
            set(newDebtRef, {
                name: name,
                amount: amount,
                timestamp: Date.now()
            }).then(() => {
                debtForm.reset();
            }).catch(err => {
                alert("Chyba při ukládání do databáze: " + err.message);
            });
        });

        // NAČÍTÁNÍ DLUHŮ V REÁLNÉM ČASE
        function nactiDluhy(uid) {
            const userDebtsRef = ref(db, `debts/${uid}`);
            onValue(userDebtsRef, (snapshot) => {
                debtListElement.innerHTML = "";
                const data = snapshot.val();
                
                if (data) {
                    Object.keys(data).forEach(key => {
                        const debt = data[key];
                        
                        const li = document.createElement('li');
                        li.className = 'debt-item';
                        li.innerHTML = `
                            <div class="debt-info">
                                <div class="name">${debt.name}</div>
                                <div class="amount">${debt.amount} Kč</div>
                            </div>
                            <button class="delete-debt" data-id="${key}"><i class="fa-solid fa-trash"></i></button>
                        `;
                        
                        debtListElement.appendChild(li);
                    });

                    // Aktivace mazacích tlačítek
                    document.querySelectorAll('.delete-debt').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const debtId = button.getAttribute('data-id');
                            smazDluh(uid, debtId);
                        });
                    });
                } else {
                    debtListElement.innerHTML = '<p style="text-align:center; color:var(--text-light); font-size:0.875rem;">Žádné dluhy nenalezeny.</p>';
                }
            });
        }

        // MAZÁNÍ DLUHU Z DATABÁZE
        function smazDluh(uid, debtId) {
            const debtRef = ref(db, `debts/${uid}/${debtId}`);
            remove(debtRef);
        }
    </script>
</body>
</html>
